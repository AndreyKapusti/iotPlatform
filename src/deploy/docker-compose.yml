services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: signaldeck_postgres
    environment:
      POSTGRES_USER: signaldeck
      POSTGRES_PASSWORD: signaldeck
      POSTGRES_DB: signaldeck
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signaldeck -d signaldeck"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: signaldeck_mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  control:
    build:
      context: ../control
    container_name: signaldeck_control
    environment:
      DATABASE_URL: postgresql://signaldeck:signaldeck@postgres:5432/signaldeck
      JWT_SECRET: signaldeck-dev-secret-change-me
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  ingest:
    build:
      context: ../ingest
    container_name: signaldeck_ingest
    environment:
      DATABASE_URL: postgres://signaldeck:signaldeck@postgres:5432/signaldeck?sslmode=disable
      MQTT_BROKER: tcp://mosquitto:1883
      HTTP_ADDR: ":8001"
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  web:
    build:
      context: ../web
    container_name: signaldeck_web
    ports:
      - "3000:80"
    depends_on:
      - control
      - ingest

  simulator:
    build:
      context: ../simulator
    container_name: signaldeck_simulator
    environment:
      CONTROL_URL: http://control:8000
      INGEST_HTTP_URL: http://ingest:8001
      MQTT_BROKER: mosquitto:1883
      INTERVAL_SEC: "2"
      SIGNALDECK_EMAIL: admin@example.com
      SIGNALDECK_USERNAME: admin
      SIGNALDECK_PASSWORD: admin123
      DEVICE_NAME: demo-sensor
      USE_MQTT: "false"
    depends_on:
      control:
        condition: service_started
      ingest:
        condition: service_started
      mosquitto:
        condition: service_started
    restart: unless-stopped
    profiles:
      - demo

volumes:
  postgres_data:
